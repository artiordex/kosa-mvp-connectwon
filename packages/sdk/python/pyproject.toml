[tool.poetry]
name = "connectwon-sdk"
version = "1.0.0"
description = "ConnectWon Python SDK for web scraping, AI integration, and data analysis"
authors = ["Shiwoo Min <shiwoo@connectwon.com>"]
readme = "README.md"
packages = [{include = "connectwon_sdk"}]

[tool.poetry.dependencies]
python = "^3.8"
aiohttp = "^3.8.0"

[tool.poetry.group.ai.dependencies]
openai = "^1.0.0"
anthropic = "^0.7.0"
huggingface-hub = "^0.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line-length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
