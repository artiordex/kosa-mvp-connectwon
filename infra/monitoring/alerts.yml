# Description : alerts.yml - 📌 ConnectWon MVP Alert 룰
# Author : Shiwoo Min
# Date : 2025-09-15
# 09-16 - printf 포맷팅 적용
# 09-22 - 불필요한 or 조건 제거, 표현식 정리, 주석 가독성 개선
# 09-23 - 서비스 순서 재배치 (admin → web → api → worker → db → system)
# 09-28 - instance 라벨 추가, Latency 임계값 완화, Load 계산 개선

groups:
  # Admin (Next.js 관리자 대시보드)
  - name: connectwon-admin-alerts
    rules:
      - alert: ConnectWonAdminDown
        expr: up{job="connectwon-admin"} == 0
        for: 2m
        labels:
          severity: critical
          service: admin
          team: frontend
        annotations:
          summary: 'Admin 애플리케이션 다운'
          description: '관리자 대시보드 서비스에 2분 이상 연결 불가 (instance={{ $labels.instance }})'

  # Web (Next.js 사용자 앱)
  - name: connectwon-web-alerts
    rules:
      - alert: ConnectWonWebDown
        expr: up{job="connectwon-web"} == 0
        for: 2m
        labels:
          severity: critical
          service: web
          team: frontend
        annotations:
          summary: 'Web 애플리케이션 다운'
          description: '사용자 Web 서비스에 2분 이상 연결 불가 (instance={{ $labels.instance }})'

  # API (Nest)
  - name: connectwon-api-alerts
    rules:
      # API 서버 다운
      - alert: ConnectWonAPIDown
        expr: up{job="connectwon-api"} == 0
        for: 30s
        labels:
          severity: critical
          service: api
          team: backend
        annotations:
          summary: 'API 서버 다운'
          description: 'API 서버에 30초 이상 연결 불가 (instance={{ $labels.instance }})'

      # API 응답 시간 (p95 > 3s, MVP 기준)
      - alert: ConnectWonAPIHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="connectwon-api"}[5m]))
          ) > 3
        for: 3m
        labels:
          severity: warning
          service: api
          team: backend
        annotations:
          summary: 'API 응답 시간 증가 (p95 > 3s)'
          description: 'API 95퍼센타일 응답 시간이 3초 초과 (현재: {{ printf "%.2f" $value }}s, instance={{ $labels.instance }})'

      # API 에러율 (5xx 비율 > 5%)
      - alert: ConnectWonAPIHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="connectwon-api", code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="connectwon-api"}[5m])) * 100 > 5
        for: 2m
        labels:
          severity: critical
          service: api
          team: backend
        annotations:
          summary: 'API 에러율 급증 (>5%)'
          description: '5xx 에러율 5% 초과 (현재: {{ printf "%.2f" $value }}%%, instance={{ $labels.instance }})'

      # API 트래픽 급증 (RPS > 100)
      - alert: ConnectWonAPITrafficSpike
        expr: sum(rate(http_requests_total{job="connectwon-api"}[5m])) > 100
        for: 5m
        labels:
          severity: warning
          service: api
          team: backend
        annotations:
          summary: 'API 트래픽 급증'
          description: '분당 API 요청 급증 (현재: {{ printf "%.2f" $value }} RPS, instance={{ $labels.instance }})'

  # Worker
  - name: connectwon-worker-alerts
    rules:
      - alert: ConnectWonWorkerDown
        expr: up{job="connectwon-worker"} == 0
        for: 1m
        labels:
          severity: critical
          service: worker
          team: backend
        annotations:
          summary: 'Worker 프로세스 다운'
          description: '백그라운드 작업 처리 중단 (instance={{ $labels.instance }})'

  # Postgres (Database)
  - name: connectwon-postgres-alerts
    rules:
      - alert: ConnectWonDatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: database
          team: backend
        annotations:
          summary: 'PostgreSQL 다운'
          description: 'DB 연결 불가 (1분 이상, instance={{ $labels.instance }})'

      # 연결 수 과다
      - alert: ConnectWonDatabaseHighConnections
        expr: sum(pg_stat_database_numbackends) > 80
        for: 5m
        labels:
          severity: warning
          service: database
          team: backend
        annotations:
          summary: 'DB 연결 수 과다'
          description: '총 연결 수 80개 초과 (현재: {{ printf "%.0f" $value }}개, instance={{ $labels.instance }})'
          # TODO: 환경별 max_connections에 맞춰 조정 필요

  # 시스템 (node_exporter)
  - name: connectwon-system-alerts
    rules:
      - alert: ConnectWonHighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
          team: infrastructure
        annotations:
          summary: 'CPU 사용률 높음'
          description: 'CPU 80% 초과 (현재: {{ printf "%.2f" $value }}%%, instance={{ $labels.instance }})'

      # 높은 메모리 사용률
      - alert: ConnectWonHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
          team: infrastructure
        annotations:
          summary: '메모리 사용률 높음'
          description: '메모리 85% 초과 (현재: {{ printf "%.2f" $value }}%%, instance={{ $labels.instance }})'

      # 디스크 공간 부족 (tmpfs/overlay 제외)
      - alert: ConnectWonLowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
          team: infrastructure
        annotations:
          summary: '디스크 공간 부족'
          description: '디스크 사용률 80% 초과 (경로={{ $labels.mountpoint }}, 현재: {{ printf "%.2f" $value }}%%, instance={{ $labels.instance }})'

      # 시스템 로드 평균 높음
      - alert: ConnectWonHighSystemLoad
        expr: (node_load15 / count(node_cpu_seconds_total{mode="system"})) > 1
        for: 10m
        labels:
          severity: warning
          service: system
          team: infrastructure
        annotations:
          summary: '시스템 로드 높음'
          description: '15분 평균 Load > vCPU 수 (현재: {{ printf "%.2f" $value }}, instance={{ $labels.instance }})'
