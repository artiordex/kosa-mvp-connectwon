# Description : grafana.ini - 📌 ConnectWon MVP Grafana 설정
# Author : Shiwoo Min
# Date : 2025-09-15
# 09-22 - ENV 기반 보안 권장 강화, PostgreSQL 전환 주석 추가
# 참고:
#  - 접속: http://localhost:3030 (admin / $GF_SECURITY_ADMIN_PASSWORD)
#  - DB: MVP 단계 SQLite, 프로덕션은 PostgreSQL 권장
#  - 한국 시간대, 다크 테마 기본

# 애플리케이션 모드
app_mode = production
instance_name = connectwon-grafana

# Server
[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3030            # 09-15: 3030으로 통일
domain = localhost
root_url = http://localhost:3030
serve_from_sub_path = false
router_logging = false
enable_gzip = true

# Paths (기본 경로 사용, 필요시 커스터마이즈)
# [paths]
# data = /var/lib/grafana
# logs = /var/log/grafana
# plugins = /var/lib/grafana/plugins
# provisioning = /etc/grafana/provisioning

# Database
[database]
# MVP: SQLite (간단 배포용).
# PROD: PostgreSQL 권장 → type=postgres, host, name, user, password ENV로 주입
type = sqlite3
path = /var/lib/grafana/grafana.db
max_idle_conn = 2
conn_max_lifetime = 14400
log_queries = false

# Security
[security]
# 09-22: 반드시 ENV 기반으로 설정 (GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD)
admin_user = admin
# admin_password, secret_key는 절대 깃에 커밋 금지
# admin_password = connectwon2024
# secret_key = connectwon_mvp_secret_key_2024_secure
disable_gravatar = true
disable_brute_force_login_protection = false
allow_embedding = false
x_content_type_options = true
x_xss_protection = true

# Analytics
[analytics]
reporting_enabled = false
check_for_updates = false

# Users
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Editor
default_theme = dark
viewers_can_edit = false

# Anonymous Auth
[auth.anonymous]
enabled = false

# Basic Auth
[auth.basic]
enabled = true

# Dashboards
[dashboards]
versions_to_keep = 20
min_refresh_interval = 5s
# 09-15: 홈 대시보드 지정 (파일은 Compose/K8s에서 볼륨 마운트 필요)
default_home_dashboard_path = /var/lib/grafana/dashboards/dashboards.json
# 추가적으로 provisioning/dashboards/*.yml 경로를 병행 사용 가능

# Logging
[log]
mode = console file
level = info               # 운영: info, 디버깅: debug

[log.console]
level = info
format = console

[log.file]
level = info
format = text
log_rotate = true
max_lines = 1000000
daily_rotate = true
max_days = 7

# Usage Quotas
[quota]
enabled = false

# Unified Alerting (신규)
[unified_alerting]
enabled = true
admin_config_poll_interval = 60s
alertmanager_config_poll_interval = 60s
execute_alerts = true

# 09-15: 레거시 [alerting] 섹션 제거 → unified_alerting만 사용

# Data Proxy
[dataproxy]
logging = true
timeout = 30
dial_timeout = 10

# Metrics
[metrics]
enabled = true
disable_total_stats = false

# Feature Toggles
[feature_toggles]
enable = ngalert,live

# Date Formats
[date_formats]
default_timezone = Asia/Seoul
use_browser_locale = false
