/**
 * Description : nginx.conf - 📌 nginx 기본 설정 (DuckDNS 기반 도메인 라우팅)
 * Author : Shiwoo Min
 * Date : 2025-09-25
 * 09-07 - admin 대시보드 추가
 * 09-15 - 캐시/보안 헤더 개선, admin basePath 대응
 * 09-16 - 보안 강화 (Admin IP 제한, Rate Limiting), 로깅, Buffer 최적화 추가
 * 09-23 - 개발환경을 위한 제한 완화 (IP 제한, Rate Limit, CSP) & HTTPS + Admin IP 제한 추가
 * 09-24 - DuckDNS 도메인 매핑 적용 (web/api/admin 각각 별도 도메인)
 * 참고 : https://www.duckdns.org/domains
 */

user nginx;
worker_processes auto;

# 로그 설정
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 로깅 설정
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  # Buffer 크기 최적화
  client_body_buffer_size 16K;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  client_max_body_size 20m;

  # Proxy 버퍼링 최적화
  proxy_buffering on;
  proxy_buffer_size 8k;
  proxy_buffers 8 8k;
  proxy_busy_buffers_size 16k;

  # Rate Limiting 존 정의
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

  # WebSocket 업그레이드 헬퍼
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 압축
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_types application/wasm font/woff2 font/woff font/ttf;

  # Docker compose 서비스명을 그대로 upstream 호스트로 사용
  upstream web   { server web:3000; keepalive 64; }
  upstream api   { server api:8000; keepalive 64; }
  upstream admin { server admin:3001; keepalive 64; }

  # SSL 공통 설정 (운영환경)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;

  # WEB (Next.js SSR)
  server {
    listen 80;
    server_name connectwon-web.duckdns.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name connectwon-web.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/connectwon-web.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectwon-web.duckdns.org/privkey.pem;

    location / {
      limit_req zone=general burst=100 nodelay;
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;

      # SSR HTML 캐시 금지
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }

    # 정적 자산 캐싱
    location ~* ^/_next/static/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
    }
  }

  # API (NestJS)
  server {
    listen 80;
    server_name connectwon-api.duckdns.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name connectwon-api.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/connectwon-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectwon-api.duckdns.org/privkey.pem;

    location / {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;

      # API 전용 보안 헤더
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
    }

    # 헬스 체크
    location = /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }

  # ADMIN (Next.js Dashboard)
  server {
    listen 80;
    server_name connectwon-admin.duckdns.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name connectwon-admin.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/connectwon-admin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectwon-admin.duckdns.org/privkey.pem;

    # 운영환경에서 관리자 접근 제한
    allow 123.123.123.123;   # 허용할 관리자 IP (예: 사무실 고정 IP)
    deny all;

    location / {
      limit_req zone=admin burst=30 nodelay;
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;

      # Admin 전용 보안 헤더
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:;" always;
    }

    # 정적 자산 캐싱
    location ~* ^/_next/static/ {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
