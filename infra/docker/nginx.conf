/**
 * Description : nginx.conf - 📌 nginx 기본 설정
 * Author : Shiwoo Min
 * Date : 2025-09-05
 * 09-07 - admin 대시보드 추가
 * 09-15 - 캐시/보안 헤더 개선, admin basePath 대응
 * 09-16 - 보안 강화 (Admin IP 제한, Rate Limiting), 로깅, Buffer 최적화 추가
 * 09-23 - 개발환경을 위한 제한 완화 (IP 제한, Rate Limit, CSP)
 */

# /etc/nginx/nginx.conf 로 복사/마운트해서 사용
user  nginx;
worker_processes auto;

# 로그 설정
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 로깅 설정
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  # Buffer 크기 최적화
  client_body_buffer_size 16K;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  client_max_body_size 20m;

  # Proxy 버퍼링 최적화
  proxy_buffering on;
  proxy_buffer_size 8k;
  proxy_buffers 8 8k;
  proxy_busy_buffers_size 16k;

  # Rate Limiting 존 정의 (개발환경용 - 더 관대함)
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

  # WebSocket 업그레이드 헬퍼
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 압축 (브라우저가 지원 시)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_types application/wasm font/woff2 font/woff font/ttf;

  # (선택) brotli 모듈이 있는 이미지면 주석 해제
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Docker compose 서비스명을 그대로 upstream 호스트로 사용
  upstream web {
    server web:3000;
    keepalive 64;
  }

  upstream api {
    server api:8000;
    keepalive 64;
  }

  # 관리자 대시보드 upstream 추가
  upstream admin {
    server admin:3001;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    # 일반적인 Rate Limiting 적용
    limit_req zone=general burst=100 nodelay;

    # 헬스 체크
    location = /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # API 먼저 매칭 (/api -> api 서비스)
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      # WebSocket/SSE 타임아웃 연장
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # 09-16 - API 보안 헤더 강화
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
    }

    # 관리자 대시보드 (/admin -> admin 서비스)
    location /admin/ {
      # 09-16 - 관리자 접근 제한 (개발환경에서는 IP 제한 해제)
      # 운영환경에서는 아래 라인들 주석 해제
      # allow 127.0.0.1;              # 로컬호스트
      # allow 10.0.0.0/8;             # Docker 내부 네트워크
      # allow 172.16.0.0/12;          # Docker 컨테이너 네트워크
      # allow 192.168.0.0/16;         # 사설망
      # deny all;

      # Admin Rate Limiting
      limit_req zone=admin burst=30 nodelay;

      proxy_pass http://admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      # WebSocket/SSE 타임아웃 연장
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # 관리자 대시보드 전용 보안 헤더
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Content-Type-Options nosniff always;
      # HTML 응답 캐시 금지
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;

      # Admin 전용 CSP 헤더 추가
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    }

    # 관리자 대시보드 정적 자산 캐싱
    location ~* ^/admin/_next/static/ {
      # 개발환경에서는 IP 제한 해제
      # 운영환경에서는 아래 라인들 주석 해제
      # allow 127.0.0.1;
      # allow 10.0.0.0/8;
      # allow 172.16.0.0/12;
      # allow 192.168.0.0/16;
      # deny all;

      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
    }

    # Next.js HMR WebSocket 지원
    location /_next/webpack-hmr {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js 사용자 앱 정적자산 강캐시
    location ~* ^/_next/static/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
    }

    location ~* ^/(assets|static)/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      add_header X-Content-Type-Options nosniff always;
    }

    # n8n 웹훅 경로
    location /webhook/ {
      limit_req zone=api burst=30 nodelay;

      proxy_pass http://n8n:5678/webhook/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      # Webhook 응답 캐시 금지
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # Next.js SSR/라우팅 (웹소켓 포함)
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      # WebSocket/SSE 타임아웃 연장
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      # SSR HTML 캐시 금지
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }

    # 공통 보안 헤더 강화
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # HTTPS 준비 (운영환경에서 주석 해제)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 개발환경용 관대한 CSP
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; font-src 'self' https:; connect-src 'self' ws: wss:;" always;
  }

  # HTTPS 리다이렉션 서버 블록 (운영환경에서 주석 해제)
  # server {
  #   listen 80;
  #   server_name your-domain.com;
  #   return 301 https://$server_name$request_uri;
  # }

  # HTTPS 서버 블록 템플릿 (SSL 인증서 설정 후 주석 해제)
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #
  #   ssl_certificate /etc/ssl/certs/your-domain.crt;
  #   ssl_certificate_key /etc/ssl/private/your-domain.key;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #
  #   # SSL 보안 헤더
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  #
  #   # 기존 location 블록들을 여기에 복사
  # }
}
