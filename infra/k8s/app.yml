# Description : app.yml - 📌 K8s ArgoCD 매니페스트 (수정 버전)
# Author : Shiwoo Min
# Date : 2025-09-15
# 09-22 - NetPol/DNS 수정, API migration pnpm 반영, ingress rewrite, worker probe 개선, 로그 볼륨 추가
# 참고 :
# - 이미지 레포: ghcr.io/artiordex/kosa-mvp-connectwon/<service>:latest

---
# 네임스페이스
apiVersion: v1
kind: Namespace
metadata:
  name: connectwon
  labels:
    app.kubernetes.io/part-of: connectwon

---
# 공통 환경변수
apiVersion: v1
kind: ConfigMap
metadata:
  name: connectwon-config
  namespace: connectwon
data:
  TZ: 'Asia/Seoul'
  NODE_ENV: 'production'

---
# 기본 NetworkPolicy (DNS/내부만 허용)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: connectwon
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS 허용
    - to: {}
      ports:
        - protocol: UDP
          port: 53
    # 내부 서비스 간 통신 허용
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: connectwon

---
# Web NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-netpol
  namespace: connectwon
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx-ingress
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000

---
# Web (Next.js 사용자 앱)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: connectwon
  labels: { app: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/artiordex/kosa-mvp-connectwon/web:latest
          ports: [{ containerPort: 3000 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets }
          readinessProbe:
            httpGet: { path: '/', port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: '/', port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: '200m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
          volumeMounts:
            - { name: tmp-volume, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: logs, mountPath: /app/logs }
      volumes:
        - { name: tmp-volume, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
        - { name: logs, emptyDir: {} }

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: connectwon
  labels: { app: web }
spec:
  type: ClusterIP
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: 3000 }

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: connectwon
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: connectwon
spec:
  minAvailable: 1
  selector: { matchLabels: { app: web } }

---
# Admin (관리자 대시보드)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: connectwon
  labels: { app: admin }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin } }
  template:
    metadata:
      labels: { app: admin }
    spec:
      imagePullSecrets: [ { name: ghcr-pull-secret } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: admin
          image: ghcr.io/artiordex/kosa-mvp-connectwon/admin:latest
          ports: [{ containerPort: 3001 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets }
          readinessProbe:
            httpGet: { path: '/', port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: '/', port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
          volumeMounts:
            - { name: tmp-volume, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: logs, mountPath: /app/logs }
      volumes:
        - { name: tmp-volume, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
        - { name: logs, emptyDir: {} }

---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: connectwon
  labels: { app: admin }
spec:
  type: ClusterIP
  selector: { app: admin }
  ports:
    - { name: http, port: 80, targetPort: 3001 }

---
# API (Nest/Express)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: connectwon
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: '/metrics'
    spec:
      imagePullSecrets: [ { name: ghcr-pull-secret } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: migration
          image: ghcr.io/artiordex/kosa-mvp-connectwon/api:latest
          command: ['pnpm', 'run', 'db:migrate']
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # 마이그레이션은 쓰기 필요
            capabilities: { drop: [ "ALL" ] }
      containers:
        - name: api
          image: ghcr.io/artiordex/kosa-mvp-connectwon/api:latest
          ports: [{ containerPort: 8000 }]
          env: [ { name: PORT, value: '8000' } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets }
          readinessProbe:
            httpGet: { path: '/health', port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: '/health', port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: '300m', memory: '512Mi' }
            limits: { cpu: '1000m', memory: '1Gi' }
          volumeMounts:
            - { name: tmp-volume, mountPath: /tmp }
            - { name: logs, mountPath: /app/logs }
      volumes:
        - { name: tmp-volume, emptyDir: {} }
        - { name: logs, emptyDir: {} }

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: connectwon
  labels: { app: api }
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: 8000 }

---
# Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: connectwon
  labels: { app: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
    spec:
      imagePullSecrets: [ { name: ghcr-pull-secret } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/artiordex/kosa-mvp-connectwon/worker:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets }
          livenessProbe:
            exec:
              command: ['sh', '-c', "redis-cli -u $REDIS_URL ping | grep PONG"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
          volumeMounts:
            - { name: tmp-volume, mountPath: /tmp }
            - { name: logs, mountPath: /app/logs }
      volumes:
        - { name: tmp-volume, emptyDir: {} }
        - { name: logs, emptyDir: {} }

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connectwon
  namespace: connectwon
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: connectwon.local
      http:
        paths:
          - path: /()(.*)
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
          - path: /admin(/|$)(.*)
            pathType: Prefix
            backend:
              service: { name: admin, port: { number: 80 } }

# n8n (Workflow Automation)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: connectwon
  labels: { app: n8n }
spec:
  replicas: 1
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: n8n
          image: n8nio/n8n:1.80.0
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_HOST
              value: "n8n.connectwon.svc.cluster.local"
            - name: GENERIC_TIMEZONE
              value: "Asia/Seoul"
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "true"
            - name: N8N_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: connectwon-secrets
                  key: N8N_USER
            - name: N8N_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: connectwon-secrets
                  key: N8N_PASSWORD
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                secretKeyRef:
                  name: connectwon-secrets
                  key: POSTGRES_HOST
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: connectwon-secrets
                  key: POSTGRES_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: connectwon-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: connectwon
  labels: { app: n8n }
spec:
  type: ClusterIP
  selector: { app: n8n }
  ports:
    - name: http
      port: 80
      targetPort: 5678

---
# (Optional) Ingress - 외부 접근용
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: connectwon
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: n8n.connectwon.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port: { number: 80 }

---
# PVC (워크플로우/설정 저장)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: connectwon
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
