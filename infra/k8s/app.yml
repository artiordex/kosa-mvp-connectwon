# Description : app.yml - 📌 K8s ArgoCD 매니페스트
# Author : Shiwoo Min
# Date : 2025-09-15
# 참고 :
# - 이미지 레포: ghcr.io/artiordex/kosa-mvp-connectwon/<service>:latest

---
# 네임스페이스
apiVersion: v1
kind: Namespace
metadata:
  name: connectwon
  labels:
    app.kubernetes.io/part-of: connectwon

---
# 공통 환경변수
apiVersion: v1
kind: ConfigMap
metadata:
  name: connectwon-config
  namespace: connectwon
data:
  TZ: 'Asia/Seoul'
  NODE_ENV: 'production'

---
# Web(Next.js 사용자 앱)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: connectwon
  labels: { app: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
      # Prometheus 스크랩(선택) – /metrics를 제공할 때만 주석 해제
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port: "3000"
      #   prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/artiordex/kosa-mvp-connectwon/web:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets } # 필요 시 사용
          # Next.js 헬스엔드포인트가 없다면, 200 루트 응답으로 간단히 체크
          readinessProbe:
            httpGet: { path: '/', port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: '/', port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: connectwon
  labels: { app: web }
spec:
  type: ClusterIP
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
# Admin(Next.js 관리자 대시보드)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: connectwon
  labels: { app: admin }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin } }
  template:
    metadata:
      labels: { app: admin }
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port: "3001"
      #   prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: admin
          image: ghcr.io/artiordex/kosa-mvp-connectwon/admin:latest
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets }
          readinessProbe:
            httpGet: { path: '/', port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: '/', port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: connectwon
  labels: { app: admin }
spec:
  type: ClusterIP
  selector: { app: admin }
  ports:
    - name: http
      port: 80
      targetPort: 3001

---
# API(Nest/Express)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: connectwon
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      # Prometheus가 /metrics 수집 (노출 시 활성화)
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: '/metrics'
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/artiordex/kosa-mvp-connectwon/api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - name: PORT
              value: '8000'
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets } # DATABASE_URL / REDIS_URL / JWT_SECRET 등
          readinessProbe:
            httpGet: { path: '/health', port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: '/health', port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests: { cpu: '200m', memory: '384Mi' }
            limits: { cpu: '1000m', memory: '1Gi' }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: connectwon
  labels: { app: api }
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - name: http
      port: 80
      targetPort: 8000

---
# Worker(BullMQ 등 백그라운드 작업자) – HTTP 트래픽은 없지만 /metrics를 열 경우 수집용 Service를 둘 수 있음
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: connectwon
  labels: { app: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port: "3003"
      #   prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/artiordex/kosa-mvp-connectwon/worker:latest
          # metrics만 있다면 containerPort 생략 가능. 노출 시 아래 주석 해제:
          # ports: [{ containerPort: 3003 }]
          envFrom:
            - configMapRef: { name: connectwon-config }
            - secretRef: { name: connectwon-secrets } # QUEUE_REDIS_URL / REDIS_URL / DATABASE_URL 등
          # 워커는 프로브가 애매할 수 있음 → 주기적 작업/메트릭 노출 기준으로 조정
          livenessProbe:
            exec: { command: ['sh', '-c', "node -e 'process.exit(0)'"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: '50m', memory: '128Mi' }
            limits: { cpu: '500m', memory: '512Mi' }

---
