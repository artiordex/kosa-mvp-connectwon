# Description : secrets.yaml - 📌 ArgoCD Kubernetes Secret 설정
# Author : Shiwoo Min
# Date : 2025-09-24

apiVersion: v1
kind: Secret
metadata:
  name: connectwon-secrets
  namespace: connectwon
  labels:
    app: connectwon
    managed-by: argocd
type: Opaque
stringData:
  # Database
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  DATABASE_URL: ${DATABASE_URL}

  # Redis
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_URL: ${REDIS_URL}
  QUEUE_REDIS_URL: ${QUEUE_REDIS_URL}

  # Authentication & Security
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  COOKIE_SECRET: ${COOKIE_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}

  # n8n Workflow
  N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
  N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

  # Email & Notifications
  SMTP_PASS: ${SMTP_PASS}
  SLACK_TOKEN: ${SLACK_TOKEN}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

  # External APIs
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

  # Monitoring
  SENTRY_DSN: ${SENTRY_DSN}
  NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
  GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY}

  # Social OAuth
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}

---
# Non-sensitive configuration as ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: connectwon-config
  namespace: connectwon
  labels:
    app: connectwon
    managed-by: argocd
data:
  # Environment
  NODE_ENV: "development"
  TZ: "Asia/Seoul"

  # Ports
  WEB_PORT: "3000"
  API_PORT: "8000"
  ADMIN_PORT: "3001"

  # Database (non-sensitive)
  POSTGRES_PORT: "5432"
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "10"

  # Redis (non-sensitive)
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # URLs
  API_URL: "http://localhost:8000"
  WEB_URL: "http://localhost:3000"
  ADMIN_URL: "http://localhost:3001"

  # Business Settings
  PAYMENT_PROVIDER: "stripe"
  PAYMENT_CURRENCY: "KRW"
  DEFAULT_LANGUAGE: "ko"

  # Feature Flags
  FEATURE_AI_RECOMMENDATIONS: "true"
  FEATURE_PAYMENT_GATEWAY: "true"
  FEATURE_EMAIL_NOTIFICATIONS: "true"

  # Company Info
  COMPANY_NAME: "ConnectWon"
  COMPANY_EMAIL: "contact@connectwon.com"
