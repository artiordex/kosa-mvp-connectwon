# Description : pnpm-workspace.yaml - 📌 모노레포 워크스페이스 패키지 정의
# Author : Shiwoo Min
# Date : 2025-09-12
# pnpm run build:packages - 모든 패키지 빌드
# pnpm nx run-many -t build - 모든 패키지 빌드 (Nx 사용 시 pnpm)
# npx tsc --noEmit - 모든 패키지 타입체크
# pnpm nx graph - 의존성 그래프 시각화
# API 서버 (포트 8000) - pnpm --filter @connectwon/api dev
# 관리자 대시보드 (포트 3001) - pnpm --filter @connectwon/admin dev
# 워커 (백그라운드 작업) - pnpm --filter @connectwon/worker start
# 전체 의존성 확인 - pnpm list -r

packages:
  - 'apps/*'
  - 'packages/*'
  - 'infra/*'
  # Applications
  - 'apps/admin' # 관리자 대시보드 (Admin Dashboard)
  - 'apps/api' # REST API 서버 (Backend API Server)
  - 'apps/web' # 사용자 웹 앱 (Frontend Web App)
  - 'apps/e2e' # 통합 테스트 (End-to-End Tests)
  - 'apps/worker' # 백그라운드 작업 처리 (Background Job Worker)

  # Shared Packages
  - 'packages/api-contract' # API 스키마 정의 (API Schema & Types)
  - 'packages/configs' # 환경설정 관리 (Configuration Management)
  - 'packages/core' # 핵심 비즈니스 로직 (Core Business Logic)
  - 'packages/logger' # 로깅 시스템 (Logging System)
  - 'packages/sdk' # 클라이언트 SDK (Client SDK)
  - 'packages/client' # 클라이언트 유틸리티 (Client Utilities)
  - 'packages/server' # 서버 유틸리티 (Server Utilities)
  - 'packages/database' # 데이터베이스 ORM (Database & ORM)
  - 'packages/ui' # UI 컴포넌트 라이브러리 (UI Components)
