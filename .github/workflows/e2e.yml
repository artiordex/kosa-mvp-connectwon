# Description : e2e.yml - 📌 Docker Compose 기반 Playwright E2E 테스트 파이프라인
# Author : Shiwoo Min
# Date : 2025-09-16
name: E2E (minimal)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: infra/docker/docker-compose.yml
      HOST_RESULTS_DIR: apps/e2e/test-results

    steps:
      - uses: actions/checkout@v4

      - name: Prepare results dir
        run: mkdir -p "${{ env.HOST_RESULTS_DIR }}"

      - name: Build & start
        run: docker compose -f "${COMPOSE_FILE}" up -d --build

      - name: Run E2E
        run: docker compose -f "${COMPOSE_FILE}" run --rm e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            ${{ env.HOST_RESULTS_DIR }}/html-report
            ${{ env.HOST_RESULTS_DIR }}/junit.xml
          if-no-files-found: warn

      - name: Down
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down -v
