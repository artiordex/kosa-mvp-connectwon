# Description : ci.yml - 📌 CI/CD 파이프라인 설정
# Author : Shiwoo Min
# Date : 2025-09-11
# 09-15: Node.js + pnpm 환경을 package.json 기준으로 일관되게 셋업

name: CI

on:
  # main, develop 브랜치로 push될 때 CI 실행
  push:
    branches: [main, develop]
  # main, develop 브랜치로 PR 생성 시에도 실행
  pull_request:
    branches: [main, develop]

env:
  # Node.js 런타임 버전
  NODE_VERSION: '20.x'

jobs:
  ci:
    # GitHub 호스팅 최신 Ubuntu 이미지에서 실행
    runs-on: ubuntu-latest

    steps:
      # 1. 레포지토리 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. pnpm 설치
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # run_install 옵션을 false로 설정하여 자동 설치 방지
          run_install: false

      # 4. pnpm store 경로 가져오기
      - name: Get pnpm store path
        id: pnpm_store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # 5. pnpm store 캐싱
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          # lockfile 해시를 키로 사용 → lockfile이 바뀌면 캐시 무효화
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 6. 의존성 설치
      - name: Install
        run: pnpm install --frozen-lockfile
        # --frozen-lockfile : lockfile과 실제 의존성이 불일치하면 실패 (재현성 확보)

      # 7. Nx 캐시 캐싱
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      # 8. Lint (변경된 프로젝트만)
      - name: Lint (affected)
        run: pnpm nx affected -t lint --parallel=3
        # --parallel : 병렬 실행으로 속도 최적화
        # affected   : 변경된 범위에 해당하는 프로젝트만 lint 수행

      # 9. Test (변경된 프로젝트만)
      - name: Test (affected)
        run: pnpm nx affected -t test --parallel=3

      # 10. Build (변경된 프로젝트만)
      - name: Build (affected)
        run: pnpm nx affected -t build --parallel=2

      # 11. dist 아티팩트 업로드
      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # E2E 테스트
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e2e image + run compose
        run: |
          docker compose -f infra/docker/compose.e2e.yml build e2e
          docker compose -f infra/docker/compose.e2e.yml up --abort-on-container-exit --exit-code-from e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/test-results/
          retention-days: 3
