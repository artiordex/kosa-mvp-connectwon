# Author      : Shiwoo Min
# Date        : 2025-09-11
name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ${{ github.repository }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, admin, web, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes (skip unchanged)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.api'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.admin'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.web'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.worker'

      - name: Should build?
        id: gate
        run: |
          changed="${{ steps.changes.outputs[matrix.service] }}"
          if [ "$changed" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.gate.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
