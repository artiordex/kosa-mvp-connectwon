# Description : deploy.yml - 📌 변경된 앱 도커 빌드·푸시
# Author : Shiwoo Min
# Date : 2025-09-11
# 09-15 - 이미지 네임스페이스 구조 개선, 캐시 scope 분리, arm64 지원, QEMU 추가로 멀티아키 안정화, GHCR 권한 명시, fail-fast 비활성화
# 09-17 - 빌드 스탭 반복 건 리팩토링

name: Deploy

on:
  push:
    branches: [main]

# github.repository 대신 명시적 네임스페이스
env:
  REGISTRY: ghcr.io
  IMAGE_NS: artiordex/kosa-mvp-connectwon

# GHCR 푸시 권한을 워크플로 수준에서 명시
permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    # 한 서비스 실패해도 나머지 계속 진행
    strategy:
      fail-fast: false
      matrix:
        service: [api, admin, web, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub App 토큰 발급
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: artiordex
          repositories: kosa-mvp-connectwon

      - name: Detect changes (skip unchanged)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.api'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.admin'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.web'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.worker'

      - name: Should build?
        id: gate
        run: |
          changed="${{ steps.changes.outputs[matrix.service] }}"
          if [ "$changed" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      # 멀티아키 빌드용 QEMU (linux/amd64, linux/arm64)
      - name: Setup QEMU
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.gate.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push (multi-arch, scan disabled)
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 서비스별 scope로 캐시 분리
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # 멀티아키 빌드
          platforms: linux/amd64,linux/arm64
          # 보안 스캔 비활성화
          provenance: false
          sbom: false
